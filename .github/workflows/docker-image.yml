name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: checkout
        uses: actions/checkout@v5

      - name: setup npm
        run: npm install

      # because we first build on the github runner, like we do local
      # then inside the docker image to match the architecture
      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev 
          sudo apt-get install -y libcairo2-dev 
          sudo apt-get install -y pkg-config python3-dev

      - name: build docker image
        run: ./nx build_docker backend

      #  just tag and push
      - name: push image
        run: |
          docker tag alpha-app ghcr.io/${{ github.repository_owner }}/alpha-app:latest
          docker tag alpha-app ghcr.io/${{ github.repository_owner }}/alpha-app:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/alpha-app:latest
          docker push ghcr.io/${{ github.repository_owner }}/alpha-app:${{ github.sha }}
