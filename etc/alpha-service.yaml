components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthGetResponse:
      properties:
        status:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - healthy
          title: Status
      title: HealthGetResponse
      type: object
    HelloGetResponse:
      properties:
        message:
          examples:
          - Hello from FastAPI
          title: Message
          type: string
      required:
      - message
      title: HelloGetResponse
      type: object
    Model:
      description: Represents a specific AI model configuration.
      properties:
        description:
          description: A brief description of the model capabilities
          examples:
          - Meta Llama 3 8B model
          title: Description
          type: string
        uniqueId:
          description: The unique identifier for the model
          examples:
          - llama3:latest
          title: Uniqueid
          type: string
      required:
      - uniqueId
      - description
      title: Model
      type: object
    ModelListGetResponse:
      description: Response containing a collection of available models.
      properties:
        models:
          description: A list of available AI models
          items:
            $ref: '#/components/schemas/Model'
          title: Models
          type: array
      title: ModelListGetResponse
      type: object
    ProtectedGetResponse:
      properties:
        message:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - This is a protected endpoint
          title: Message
      title: ProtectedGetResponse
      type: object
    TelegramChatInfo:
      description: Chat information from a Telegram message.
      properties:
        chat_id:
          title: Chat Id
          type: integer
        chat_type:
          title: Chat Type
          type: string
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      required:
      - chat_id
      - chat_type
      title: TelegramChatInfo
      type: object
    TelegramClearResponse:
      description: Response model for clearing messages.
      properties:
        messages_deleted:
          title: Messages Deleted
          type: integer
        success:
          title: Success
          type: boolean
      required:
      - success
      - messages_deleted
      title: TelegramClearResponse
      type: object
    TelegramMessageResponse:
      description: Response model for a Telegram message.
      properties:
        chat:
          $ref: '#/components/schemas/TelegramChatInfo'
        created_at:
          format: date-time
          title: Created At
          type: string
        date:
          format: date-time
          title: Date
          type: string
        id:
          title: Id
          type: integer
        message_id:
          title: Message Id
          type: integer
        message_type:
          title: Message Type
          type: string
        reply_to_message_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Reply To Message Id
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        user:
          anyOf:
          - $ref: '#/components/schemas/TelegramUserInfo'
          - type: 'null'
      required:
      - id
      - message_id
      - chat
      - message_type
      - date
      - created_at
      title: TelegramMessageResponse
      type: object
    TelegramStatusResponse:
      description: Response model for Telegram client status.
      properties:
        connected:
          title: Connected
          type: boolean
        message_count:
          title: Message Count
          type: integer
        user_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: User Id
        username:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
      required:
      - connected
      - message_count
      title: TelegramStatusResponse
      type: object
    TelegramUserInfo:
      description: User information from a Telegram message.
      properties:
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
        user_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: User Id
        username:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
      title: TelegramUserInfo
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  title: Alpha API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/health:
    get:
      description: Health check endpoint
      operationId: get_health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthGetResponse'
          description: Successful Response
      summary: Health check endpoint
  /api/hello:
    get:
      description: Returns a hello message
      operationId: get_hello
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloGetResponse'
          description: Successful Response
      summary: Returns a hello message
  /api/model/add:
    post:
      description: Adds a new model configuration.
      operationId: add_model
      parameters:
      - in: query
        name: unique_id
        required: true
        schema:
          title: Unique Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Download and add a new model
  /api/model/delete/{id}:
    delete:
      description: Deletes a specific model by ID.
      operationId: delete_model
      parameters:
      - in: path
        name: id
        required: true
        schema:
          title: Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloGetResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete a model
  /api/model/list:
    get:
      description: Returns a list of all available models.
      operationId: get_model_list
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListGetResponse'
          description: Successful Response
      summary: Get all models
  /api/protected:
    get:
      description: Protected endpoint requiring JWT token
      operationId: get_protected
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedGetResponse'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Protected endpoint requiring JWT token
  /api/telegram/messages:
    delete:
      description: 'Clear all stored Telegram messages from the database.

        Requires JWT authentication.'
      operationId: clear_telegram_messages
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramClearResponse'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Clear all Telegram messages
      tags:
      - telegram
    get:
      description: "Get recent Telegram messages from the database.\nRequires JWT\
        \ authentication.\n\nArgs:\n    limit: Maximum number of messages to return\
        \ (1-1000, default 100)\n    chat_id: Optional filter by chat ID"
      operationId: get_telegram_messages
      parameters:
      - description: Maximum number of messages to return
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Maximum number of messages to return
          maximum: 1000
          minimum: 1
          title: Limit
          type: integer
      - description: Filter by chat ID
        in: query
        name: chat_id
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by chat ID
          title: Chat Id
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TelegramMessageResponse'
                title: Response Get Telegram Messages
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get recent Telegram messages
      tags:
      - telegram
  /api/telegram/status:
    get:
      description: 'Get Telegram client connection status and message count.

        Requires JWT authentication.'
      operationId: get_telegram_status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramStatusResponse'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Get Telegram client status
      tags:
      - telegram

