openapi: 3.1.0
info:
  title: Alpha API
  description: Alpha Project API
  version: 1.0.0
paths:
  /api/health:
    get:
      tags:
      - api
      summary: Health check endpoint
      description: Health check endpoint
      operationId: get_health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthGetResponse'
  /api/hello:
    get:
      tags:
      - api
      summary: Returns a hello message
      description: Returns a hello message
      operationId: get_hello
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloGetResponse'
  /api/protected:
    get:
      tags:
      - api
      summary: Protected endpoint requiring JWT token
      description: Protected endpoint requiring JWT token
      operationId: get_protected
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedGetResponse'
      security:
      - HTTPBearer: []
components:
  schemas:
    HealthGetResponse:
      properties:
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
          examples:
          - healthy
      type: object
      title: HealthGetResponse
    HelloGetResponse:
      properties:
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          examples:
          - Hello from FastAPI
      type: object
      title: HelloGetResponse
    ProtectedGetResponse:
      properties:
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          examples:
          - This is a protected endpoint
      type: object
      title: ProtectedGetResponse
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
